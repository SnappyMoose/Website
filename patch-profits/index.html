<!DOCTYPE html>
<!--
	Patch Profits web page + loading screen (Godot "custom HTML shell", web exports only).
	Set in Project > Export > Web > HTML > Custom HTML Shell. Godot fills in the $GODOT_... parts on export.
	Phones / tablets get a "not meant for your device" message and the game is never downloaded.
-->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Patch Profits</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #f3e2c0;
	background-color: #000;
	overflow: hidden;
	touch-action: none;
	font-family: Georgia, 'Times New Roman', serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* ---------- Loading screen ---------- */

#loader {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 28px;
	background: #000;
	overflow: hidden;
	transition: opacity 0.9s ease;
}

#loader.done {
	opacity: 0;
	pointer-events: none;
}

/* Slow orange fog drifting along the bottom, like the patch. */
.fog {
	position: absolute;
	left: -30%;
	width: 160%;
	height: 70%;
	bottom: -35%;
	border-radius: 50%;
	filter: blur(60px);
	pointer-events: none;
}

.fog.one {
	background: radial-gradient(ellipse at center, rgba(224, 112, 30, 0.42), rgba(224, 112, 30, 0) 70%);
	animation: drift 14s ease-in-out infinite alternate;
}

.fog.two {
	background: radial-gradient(ellipse at center, rgba(160, 60, 15, 0.38), rgba(160, 60, 15, 0) 70%);
	bottom: -42%;
	animation: drift 19s ease-in-out infinite alternate-reverse;
}

@keyframes drift {
	from { transform: translateX(-6%) scaleY(1); }
	to { transform: translateX(6%) scaleY(1.15); }
}

/* The pumpkin glows softly, like there's a candle inside. */
#pumpkin {
	width: 120px;
	height: 120px;
	position: relative;
	filter: drop-shadow(0 0 18px rgba(255, 140, 40, 0.45));
	animation: glow 2.6s ease-in-out infinite;
}

@keyframes glow {
	0%, 100% { filter: drop-shadow(0 0 14px rgba(255, 140, 40, 0.35)); }
	50% { filter: drop-shadow(0 0 30px rgba(255, 150, 50, 0.75)); }
}

#title {
	position: relative;
	margin: 0;
	font-size: clamp(30px, 5vw, 58px);
	font-weight: normal;
	letter-spacing: 0.32em;
	padding-left: 0.32em; /* keeps the spaced-out title visually centered */
	color: #e0a814;
	text-shadow: 0 0 22px rgba(224, 120, 20, 0.45), 0 2px 0 #1c1005;
}

#tagline {
	position: relative;
	margin: -14px 0 0;
	font-size: 15px;
	font-style: italic;
	letter-spacing: 0.08em;
	color: rgba(243, 226, 192, 0.55);
}

#bar {
	position: relative;
	width: min(420px, 70vw);
	height: 6px;
	border-radius: 3px;
	background: rgba(243, 226, 192, 0.1);
	overflow: hidden;
	box-shadow: 0 0 0 1px rgba(224, 152, 37, 0.25);
}

#bar-fill {
	width: 0%;
	height: 100%;
	border-radius: 3px;
	background: linear-gradient(90deg, #a8460f, #e09825);
	box-shadow: 0 0 12px rgba(224, 152, 37, 0.8);
	transition: width 0.25s ease;
}

/* Before the download size is known: a sliding glow. */
#bar.unknown #bar-fill {
	width: 30%;
	animation: slide 1.4s ease-in-out infinite;
}

@keyframes slide {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

#percent {
	position: relative;
	margin-top: -16px;
	font-size: 13px;
	letter-spacing: 0.2em;
	color: rgba(243, 226, 192, 0.5);
}

#notice {
	position: relative;
	display: none;
	max-width: min(520px, 85vw);
	text-align: center;
	font-size: 20px;
	line-height: 1.6;
	color: #f3e2c0;
	white-space: pre-line;
}

#loader.message #bar,
#loader.message #percent,
#loader.message #tagline {
	display: none;
}

#loader.message #notice {
	display: block;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="loader">
			<div class="fog one"></div>
			<div class="fog two"></div>
			<svg id="pumpkin" viewBox="0 0 120 120" aria-hidden="true">
				<path d="M60 30 C58 20 62 12 70 8" stroke="#3d6b2a" stroke-width="6" fill="none" stroke-linecap="round"/>
				<ellipse cx="38" cy="70" rx="26" ry="36" fill="#c4560f"/>
				<ellipse cx="82" cy="70" rx="26" ry="36" fill="#c4560f"/>
				<ellipse cx="60" cy="70" rx="28" ry="40" fill="#e0701e"/>
				<ellipse cx="60" cy="70" rx="12" ry="38" fill="#ec8a2e" opacity="0.6"/>
				<path d="M40 60 L50 54 L50 66 Z" fill="#ffd36b"/>
				<path d="M80 60 L70 54 L70 66 Z" fill="#ffd36b"/>
				<path d="M40 82 Q60 98 80 82 L74 84 L70 90 L64 86 L60 92 L56 86 L50 90 L46 84 Z" fill="#ffd36b"/>
			</svg>
			<h1 id="title">PATCH PROFITS</h1>
			<p id="tagline">something is waiting in the fog...</p>
			<div id="bar" class="unknown"><div id="bar-fill"></div></div>
			<div id="percent">LOADING</div>
			<div id="notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":2551636,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loader = document.getElementById('loader');
	const bar = document.getElementById('bar');
	const barFill = document.getElementById('bar-fill');
	const percent = document.getElementById('percent');
	const notice = document.getElementById('notice');

	// Shows a message instead of the loading bar (phones, missing browser features, errors).
	function showMessage(text) {
		notice.textContent = text;
		loader.classList.add('message');
	}

	// The game is made for desktop only. Phones / tablets (including iPads that report as Macs)
	// get a message, and the game is never downloaded.
	const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
		|| (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
	if (isMobile) {
		showMessage('Not meant for your device.\n\nPlease play on a desktop or laptop computer.');
		return;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});
	if (missing.length !== 0) {
		showMessage('Your browser is missing features this game needs:\n' + missing.join('\n')
			+ '\n\nTry the latest Chrome, Firefox, Edge or Safari.');
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				const value = Math.min(100, Math.floor((current / total) * 100));
				bar.classList.remove('unknown');
				barFill.style.width = value + '%';
				percent.textContent = 'LOADING  ' + value + '%';
			} else {
				bar.classList.add('unknown');
				percent.textContent = 'LOADING';
			}
		},
	}).then(() => {
		// The game is running: fade the loading screen away, then remove it.
		barFill.style.width = '100%';
		percent.textContent = 'LOADING  100%';
		loader.classList.add('done');
		setTimeout(() => loader.remove(), 1000);
	}, (err) => {
		console.error(err);
		showMessage('Something went wrong while loading.\n\n'
			+ (err instanceof Error ? err.message : String(err)) + '\n\nTry refreshing the page.');
	});
}());
		</script>
	</body>
</html>
