<!DOCTYPE html>
<!--
	The page Duolemma is served in on the web, and the loading screen it shows while the game
	downloads. Godot builds Web/index.html from this file every time you export, replacing the
	$GODOT_... words below with the real values, so edit THIS file rather than the exported one.

	Everything worth changing is in the "YOURS TO CHANGE" block just below: colours, the words,
	and the picture. The rest is Godot's own start-up code, which has to stay.

	To use a picture of your own: put it in the Web folder next to index.html (it survives
	re-exporting) and set BRAND_IMAGE to its file name. Remember to upload it with the rest.
-->

		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>DoubleGame</title>

/* ---------------------------------------------------------------- YOURS TO CHANGE ---- */
:root {
	--background: #f3bd15;        /* the game's yellow */
	--ink: #000000;               /* outlines and the bar's edge */
	--first-word: #8300ae;        /* "Duo", the blocks' purple */
	--rest-word: #f50000;         /* "lemma", the finish block's red */
	--bar-empty: #7a5e06;         /* the groove the bar fills up */
	--bar-full: #8300ae;          /* the bar itself */
	--hint: #4a3a04;              /* the small line under the bar */
	--brand-size: 180px;          /* how big the picture is */
	--fade: 0.4s;                 /* how long the loading screen takes to disappear */
}
/* --------------------------------------------------------------------------------------- */

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: var(--background);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

#brand {
	width: var(--brand-size);
	height: var(--brand-size);
	object-fit: contain;
	image-rendering: pixelated;
	filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.35));
}

#wordmark {
	font-size: clamp(48px, 10vw, 104px);
	font-weight: 900;
	letter-spacing: 3px;
	line-height: 1.1;
	/* A black edge, the way every piece of text in the game is drawn. */
	-webkit-text-stroke: 8px var(--ink);
	paint-order: stroke fill;
}

#wordmark .first { color: var(--first-word); }
#wordmark .rest { color: var(--rest-word); }

/* The bar. A <progress> is restyled so it matches the game's blocks. */
#status-progress {
	appearance: none;
	-webkit-appearance: none;
	width: min(70vw, 560px);
	height: 34px;
	border: 5px solid var(--ink);
	border-radius: 10px;
	background-color: var(--bar-empty);
	overflow: hidden;
}

#status-progress::-webkit-progress-bar { background-color: var(--bar-empty); }
#status-progress::-webkit-progress-value {
	background-color: var(--bar-full);
	transition: width 0.2s ease-out;
}
#status-progress::-moz-progress-bar { background-color: var(--bar-full); }

/* Before the download reports a size there is nothing to fill, so it sweeps instead. */
#status-progress:not([value]) {
	background-image: linear-gradient(90deg, var(--bar-empty) 0 40%, var(--bar-full) 40% 60%, var(--bar-empty) 60% 100%);
	background-size: 250% 100%;
	animation: sweep 1.1s linear infinite;
}

@keyframes sweep {
	from { background-position: 100% 0; }
	to { background-position: -60% 0; }
}

#hint {
	color: #ffffff;
	font-size: clamp(18px, 3vw, 28px);
	font-weight: 800;
	letter-spacing: 2px;
	-webkit-text-stroke: 4px var(--ink);
	paint-order: stroke fill;
}

/* Shown instead of the bar if the game can't start at all. */
#status-notice {
	display: none;
	max-width: min(80vw, 640px);
	padding: 18px 22px;
	border: 4px solid var(--ink);
	border-radius: 12px;
	background-color: #ffffff;
	color: #000000;
	font-size: 16px;
	line-height: 1.5;
	text-align: center;
}

const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadingParts = [
		document.getElementById('brand'),
		document.getElementById('wordmark'),
		statusProgress,
		document.getElementById('hint'),
	];
	const fadeMs = 400;      // keep in step with --fade in the style above

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			// Fade the loading screen out rather than snapping it away.
			statusOverlay.classList.add('done');
			window.setTimeout(() => statusOverlay.remove(), fadeMs);
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		const failed = mode === 'notice';
		loadingParts.forEach((part) => {
			if (part) {

		statusNotice.style.display = failed ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));

			Promise.race([

					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
